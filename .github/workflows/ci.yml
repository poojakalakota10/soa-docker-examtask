
name: SportsCoaching CI and Docker Push

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Spring Boot Backend
        working-directory: SportsCoachingBatch
        run: mvn clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: SportsCoaching-Frontend/package-lock.json

      - name: Build React Frontend
        working-directory: SportsCoaching-Frontend
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./SportsCoachingBatch
          push: true
          tags: poojabagula/sportscoaching-backend:latest

      - name: Build and Push Frontend Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./SportsCoaching-Frontend
          push: true
          tags: poojabagula/sportscoaching-frontend:latest
