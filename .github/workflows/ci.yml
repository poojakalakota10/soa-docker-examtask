
name: SportsCoaching CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Spring Boot Backend
        run: mvn -B clean package -DskipTests
        working-directory: SportsCoachingBatch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: SportsCoaching-Frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: SportsCoaching-Frontend

      - name: Build React Frontend
        run: npm run build
        working-directory: SportsCoaching-Frontend
